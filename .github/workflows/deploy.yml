name: CI/CD — chunimai-database

on:
  push:
    # Both, because the repos were first pushed to `master`. Renaming later
    # needs no change here.
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-database-production
  cancel-in-progress: false

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # No application code here, so "CI" means: would this break the VPS?
      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh; do bash -n "$f" && echo "ok  $f"; done

      - name: Compose file is valid
        run: |
          # Placeholder values: the check is the schema, not the secrets.
          POSTGRES_PASSWORD=ci docker compose -f docker-compose.prod.yml config --quiet
          echo "ok  docker-compose.prod.yml"

      - name: nginx configs parse
        run: |
          docker run --rm -v "$PWD/nginx:/n:ro" nginx:stable sh -c '
            set -e
            cp /n/http-globals.conf /etc/nginx/conf.d/chunimai-globals.conf
            cp /n/cloudflare-realip.conf /etc/nginx/conf.d/
            mkdir -p /etc/nginx/snippets
            cp /n/snippets-proxy.conf /etc/nginx/snippets/chunimai-proxy.conf
            # The real certificates are not in the repo, and nginx -t reads
            # them. Substitute a throwaway pair so the syntax is what gets
            # tested rather than the filesystem.
            mkdir -p /etc/ssl/cloudflare
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci" \
              -keyout /etc/ssl/cloudflare/origin.key \
              -out /etc/ssl/cloudflare/origin.pem 2>/dev/null
            cp /etc/ssl/cloudflare/origin.pem /etc/ssl/cloudflare/origin-pull-ca.pem
            cp /n/chunithm-api.conf /n/chunithm-app.conf /n/my-db.conf /etc/nginx/conf.d/
            nginx -t
          '

  deploy:
    name: Apply on VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Run the deploy script over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/repo/ChuniMaiWebApp/chunimai-database
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            git fetch --prune origin
            git checkout "origin/${{ github.ref_name }}" -- scripts/deploy.sh
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

  notify:
    name: Telegram
    needs: [ci, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ needs.deploy.result == 'success' && '🗄 *DATA DEPLOY THÀNH CÔNG*' || (needs.ci.result != 'success' && '🧪 *DATA — CI THẤT BẠI, chưa deploy*' || '❌ *DATA DEPLOY THẤT BẠI*') }}
            ────────────────────
            *Repo:* `chunimai-database`
            *Author:* ${{ github.actor }}
            *Commit:* [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            *Message:* ${{ github.event.head_commit.message || 'manual run' }}
            ────────────────────
            *CI:* ${{ needs.ci.result }} · *Deploy:* ${{ needs.deploy.result }}
            ${{ needs.deploy.result != 'success' && format('🔎 Log: https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) || '⚠️ Nếu nginx báo CHANGED trong log, phải áp dụng bằng tay trên VPS.' }}
