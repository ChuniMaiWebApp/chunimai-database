_format_version: "3.0"

services:
  - name: rest
    url: http://rest:3000
    routes:
      - name: rest-route
        paths:
          - /rest
        strip_path: true
    plugins:
      - name: cors

  - name: auth
    url: http://auth:9999
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true
    plugins:
      - name: cors

  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime-route
        paths:
          - /realtime
        strip_path: true
    plugins:
      - name: cors

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-route
        paths:
          - /storage
        strip_path: true
    plugins:
      - name: cors

  - name: meta
    url: http://meta:8080
    routes:
      - name: meta-route
        paths:
          - /pg
        strip_path: true
    plugins:
      - name: cors

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - apikey
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
