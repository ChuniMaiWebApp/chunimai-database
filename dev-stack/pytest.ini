[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Hypothesis settings
hypothesis_profile = default

[hypothesis]
# Default profile for property-based tests
max_examples = 100
deadline = None
