# =============================================================================
# chunithm-api.novaseele.com  →  NestJS on 127.0.0.1:3333
#
#   sudo cp nginx/chunithm-api.conf /etc/nginx/sites-available/chunithm-api
#   sudo ln -sf /etc/nginx/sites-available/chunithm-api /etc/nginx/sites-enabled/
#
# The browser calls this host directly from chunithm-app.novaseele.com, so this
# is a genuine cross-origin surface: CORS_ORIGIN in the API's .env has to name
# the app host, and the session cookie is scoped to .novaseele.com so both
# hosts can see it.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name chunithm-api.novaseele.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` rather than the standalone `http2 on;` directive:
    # that one arrived in nginx 1.25.1, and Ubuntu 24.04 ships 1.24, where it
    # fails the config test outright with `unknown directive "http2"`. This
    # form still works on newer nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chunithm-api.novaseele.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Nothing here is uploaded; the largest body is a sign-in form.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json;

    include /etc/nginx/snippets/chunimai-proxy.conf;

    # Extra brake in front of the credential-forwarding route. The Redis
    # throttle in the app is the real limit; this stops a flood reaching Node.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3333/api/v1/auth/login;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # SWAGGER_ENABLED=false already withholds this in production. Denied here
    # too, so flipping the flag by accident is not enough to publish the full
    # route list and the shape of the sign-in body.
    location /api/docs {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3333;

        # Signing in and refreshing a playlog both round-trip to CHUNITHM-NET,
        # which is slow and serialised — the API is waiting on SEGA, not on
        # itself.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        # Session cookies and playlogs are per-player; a shared cache here
        # would hand one player's data to another.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
