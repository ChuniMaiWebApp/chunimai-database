# =============================================================================
# Proxy headers every ChuniMai vhost sends upstream.
#
# Install to /etc/nginx/snippets/chunimai-proxy.conf
#
# $remote_addr is the visitor rather than a Cloudflare edge address because
# conf.d/cloudflare-realip.conf rewrote it. X-Forwarded-For is *set*, not
# appended: the API runs with TRUST_PROXY=1 and reads the last hop, and
# appending would let a client prepend a forged address and dodge the sign-in
# throttle.
# =============================================================================

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_http_version 1.1;
