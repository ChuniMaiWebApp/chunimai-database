# =============================================================================
# my-db.novaseele.com  →  Supabase Studio on 127.0.0.1:3010
#
#   sudo cp nginx/my-db.conf /etc/nginx/sites-available/my-db
#   sudo ln -sf /etc/nginx/sites-available/my-db /etc/nginx/sites-enabled/
#
# ─── Read this before enabling ────────────────────────────────────────────────
# Self-hosted Studio has NO authentication of its own. Whoever loads the page
# has full read and write access to every table — including app.chunithm_links,
# which holds every player's encrypted CHUNITHM-NET cookie jar. Published
# unguarded, this single hostname is worse than leaking the database password.
#
# Three independent gates, each of which alone would be enough:
#
#   1. Authenticated Origin Pulls (below). nginx demands a client certificate
#      signed by Cloudflare's origin-pull CA, so a request that skips
#      Cloudflare and talks to 163.61.72.134 directly is refused at the TLS
#      handshake. This is what makes gate 2 unskippable.
#   2. Cloudflare Access on this hostname — email one-time-code or Google.
#      Set up in Zero Trust → Access → Applications.
#   3. HTTP Basic auth (below, commented). Turn it on if you would rather not
#      run Zero Trust; leave it off if Access is configured, or you will be
#      asked for two passwords every visit.
#
# Setup for gate 1, once:
#   sudo curl -fsSL -o /etc/ssl/cloudflare/origin-pull-ca.pem \
#     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
#   then in Cloudflare: SSL/TLS → Origin Server → Authenticated Origin Pulls → on
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name my-db.novaseele.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name my-db.novaseele.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Gate 1: only Cloudflare may complete the handshake -------------------
    # An IP allowlist would not work here: conf.d/cloudflare-realip.conf has
    # already rewritten $remote_addr to the *visitor's* address, so `allow`
    # would be testing the wrong thing entirely. mTLS tests the connection
    # itself, which is what we actually mean.
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    # --- Gate 3 (optional): HTTP Basic ---------------------------------------
    # sudo apt install -y apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd-mydb <your-username>
    # auth_basic           "ChuniMai database";
    # auth_basic_user_file /etc/nginx/.htpasswd-mydb;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;
    # An admin console has no business being indexed, and Studio does not say so
    # for itself.
    add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;

    # SQL Editor posts whole queries; 10m is generous and still bounded.
    client_max_body_size 10m;

    include /etc/nginx/snippets/chunimai-proxy.conf;

    location / {
        limit_req zone=studio burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3010;

        # Studio uses websockets for its realtime panels.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # A long-running SQL Editor query should not be cut off at 60s.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        add_header Cache-Control "no-store" always;
    }
}
