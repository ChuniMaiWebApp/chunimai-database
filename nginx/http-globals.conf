# =============================================================================
# http-level directives shared by every ChuniMai vhost.
#
# Install to /etc/nginx/conf.d/chunimai-globals.conf — nginx.conf includes that
# directory inside the http block, which is where `map` and `limit_req_zone`
# have to live.
# =============================================================================

# Only a real WebSocket handshake should get `Connection: upgrade`. Sending it
# on every request tells the upstream to tear down a connection it was about to
# keep alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit zone for sign-in. The application throttles per IP and per account
# in Redis, which is the real defence; this only keeps a flood from reaching
# Node at all. Keyed on the Cloudflare-resolved client address.
#
# Doubled alongside the application limits (20/IP, 10/account per 15 min). This
# one must stay the looser of the two, or nginx would reject requests before
# the app can tell a player *why* they are being refused.
limit_req_zone $binary_remote_addr zone=login:10m rate=40r/m;

# Studio is one person clicking around, not a public API.
limit_req_zone $binary_remote_addr zone=studio:10m rate=120r/m;
