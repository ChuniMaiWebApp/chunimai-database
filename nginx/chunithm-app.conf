# =============================================================================
# chunithm-app.novaseele.com  →  Nuxt/Nitro on 127.0.0.1:3100
#
#   sudo cp nginx/chunithm-app.conf /etc/nginx/sites-available/chunithm-app
#   sudo ln -sf /etc/nginx/sites-available/chunithm-app /etc/nginx/sites-enabled/
#
# No /api location here. The browser calls chunithm-api.novaseele.com directly,
# and Nitro's own SSR calls go to 127.0.0.1:3333 without leaving the machine.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name chunithm-app.novaseele.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` rather than the standalone `http2 on;` directive:
    # that one arrived in nginx 1.25.1, and Ubuntu 24.04 ships 1.24, where it
    # fails the config test outright with `unknown directive "http2"`. This
    # form still works on newer nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chunithm-app.novaseele.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No Content-Security-Policy on purpose: the app inlines a script in <head>
    # to apply the saved theme before first paint, and a CSP without a matching
    # nonce would block it and bring back the flash of the wrong theme. Adding
    # one means teaching Nuxt to emit the nonce first.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Turn on once the domain is confirmed working over HTTPS. Browsers
    # remember it for the full max-age, so a mistake here is slow to undo.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/chunimai-proxy.conf;

    # Content-hashed build assets: immutable by construction, since a change to
    # the file changes its name.
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # SSR waits on the API, which waits on CHUNITHM-NET.
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }
}
